[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adwallz-wall-survey-automation"
version = "0.1.0"
description = "ADWALLZ automated wall survey and discovery system"
requires-python = ">=3.12"

dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]